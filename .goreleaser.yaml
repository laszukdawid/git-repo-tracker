# GoReleaser config for git-repo-tracker.
# Documentation: https://goreleaser.com
#
# On a version tag this builds the macOS app (arm64 + amd64), lipo-merges the two
# slices into a single universal binary, and publishes it to a GitHub release.
# Fyne is a CGO app, so this must run on a macOS runner (no Linux cross-compile);
# the amd64 slice is cross-built from the arm64 runner via `clang -arch x86_64`.
#
# The universal binary is then wrapped into `git-repo-tracker.app` and pushed to
# the laszukdawid/homebrew-tap cask by the release workflow — NOT here. Building
# a real .app bundle and generating a Homebrew *cask* with an `app` stanza both
# require GoReleaser Pro, so those two steps live in .github/workflows/release.yml
# (see build/macos/package-app.sh and build/macos/cask.rb.tmpl) to keep the
# toolchain free. Linux archives are built separately on a Linux runner.
version: 2

project_name: git-repo-tracker

before:
  hooks:
    # download only — don't mutate go.mod/go.sum during the release job
    - go mod download

builds:
  - id: git-repo-tracker
    main: ./cmd/git-repo-tracker
    binary: git-repo-tracker
    # MACOSX_DEPLOYMENT_TARGET pins the minimum macOS. Without it, the newer SDK on
    # the build runner stamps a high LC_BUILD_VERSION `minos` (e.g. 26.0), and dyld
    # then refuses to launch the app on older macOS such as Sequoia (15). 11.0
    # matches the cask's `depends_on macos: :big_sur` and Info.plist LSMinimumSystemVersion.
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=11.0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    # Cross-build the amd64 slice from the arm64 runner. The macOS SDK is
    # universal, so clang can target x86_64. If this ever proves flaky, drop
    # amd64 from goarch above — arm64-only still covers every Apple Silicon Mac.
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - MACOSX_DEPLOYMENT_TARGET=11.0
          - 'CC=clang -arch x86_64'
          - 'CXX=clang++ -arch x86_64'
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

# Merge the arm64 + amd64 slices into one universal binary. The release workflow
# wraps this single artifact into git-repo-tracker.app, so one cask covers both
# Intel and Apple Silicon Macs.
universal_binaries:
  - id: git-repo-tracker
    ids:
      - git-repo-tracker
    replace: true # drop the per-arch binaries; keep only the universal one

archives:
  - id: git-repo-tracker
    ids:
      - git-repo-tracker
    formats:
      - tar.gz
    # Universal binary → arch is "all"; name it clearly so the raw-binary download
    # is distinct from the .app zip the workflow uploads.
    name_template: "{{ .ProjectName }}_Darwin_universal"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: laszukdawid
    name: git-repo-tracker
  draft: false
  prerelease: auto
  mode: keep-existing # leave Linux assets uploaded by the separate Linux job intact
  name_template: "{{ .ProjectName }} v{{ .Version }}"

# NOTE: The Homebrew cask is NOT generated here. GoReleaser OSS can only emit a
# `binary` cask, but git-repo-tracker ships as a .app bundle. The release workflow
# renders build/macos/cask.rb.tmpl (an `app` cask) and pushes it to the tap after
# uploading the .app zip. See .github/workflows/release.yml.
