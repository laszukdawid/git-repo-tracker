# GoReleaser config for git-repo-tracker.
# Documentation: https://goreleaser.com
#
# Publishes prebuilt macOS binaries on a version tag and updates the
# laszukdawid/homebrew-tap Homebrew cask. The cask's post-install hook strips the
# Gatekeeper quarantine attribute so the unsigned binary runs without an
# "unidentified developer" prompt (no Apple notarization needed). Fyne is a CGO
# app, so this must run on a macOS runner (no Linux cross-compile); the amd64
# slice is cross-built from the arm64 runner via `clang -arch x86_64`. Linux
# archives are built separately on a Linux runner (see .github/workflows).
version: 2

project_name: git-repo-tracker

before:
  hooks:
    # download only — don't mutate go.mod/go.sum during the release job
    - go mod download

builds:
  - id: git-repo-tracker
    main: ./cmd/git-repo-tracker
    binary: git-repo-tracker
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    # Cross-build the amd64 slice from the arm64 runner. The macOS SDK is
    # universal, so clang can target x86_64. If this ever proves flaky, drop
    # amd64 from goarch above — arm64-only still covers every Apple Silicon Mac.
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - 'CC=clang -arch x86_64'
          - 'CXX=clang++ -arch x86_64'
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: git-repo-tracker
    ids:
      - git-repo-tracker
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: laszukdawid
    name: git-repo-tracker
  draft: false
  prerelease: auto
  mode: keep-existing # leave Linux assets uploaded by the separate Linux job intact
  name_template: "{{ .ProjectName }} v{{ .Version }}"

homebrew_casks:
  - name: git-repo-tracker
    ids:
      - git-repo-tracker
    binaries:
      - git-repo-tracker
    repository:
      owner: laszukdawid
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/laszukdawid/git-repo-tracker"
    description: "System-tray tracker for local git repositories"
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/git-repo-tracker"]
    caveats: |
      git-repo-tracker is a system-tray app — it has no main window.
      Start it with:
        git-repo-tracker
      then look for the icon in the menu bar. Left-click it for the search
      popover, right-click for the menu.

      Config lives at:
        ~/Library/Application Support/git-repo-tracker/config.yaml
    # Only push the cask on real tag releases, not snapshots/prereleases.
    skip_upload: auto
