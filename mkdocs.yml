site_name: git-repo-tracker
site_description: A fast, cross-platform system-tray tracker for local git repositories.
repo_url: https://github.com/laszukdawid/git-repo-tracker
repo_name: laszukdawid/git-repo-tracker
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Configuration: CONFIGURATION.md
  - Architecture: ARCHITECTURE.md
  - GNOME Extension: GNOME_EXTENSION.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
