version: '3'

vars:
  APP_NAME: Git Repo Tracker
  BIN: git-repo-tracker
  CLI_BIN: git-repo-tracker-cli
  APP_ID: com.github.laszukdawid.git-repo-tracker
  TAP: laszukdawid/tap
  GNOME_UUID: git-repo-tracker@laszukdawid.github.com
  GNOME_DIR: integrations/gnome-shell

includes:
  gnome:
    taskfile: ./integrations/gnome-shell/
    flatten: true

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the binary
    cmds:
      - go build -o {{.BIN}} ./cmd/{{.BIN}}

  cli-build:
    desc: Build the headless CLI bridge into ~/.local/bin
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - go build -o "$HOME/.local/bin/{{.CLI_BIN}}" ./cmd/{{.CLI_BIN}}

  app-build-local:
    desc: Build the GUI app into ~/.local/bin for desktop integrations
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - go build -o "$HOME/.local/bin/{{.BIN}}" ./cmd/{{.BIN}}

  run:
    desc: Build and run directly (useful while developing)
    cmds:
      - go run ./cmd/{{.BIN}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Format, vet and test
    deps: [fmt, vet, test]

  icon:
    desc: Regenerate icon.png from the embedded SVG via Fyne's software renderer
    cmds:
      - go run ./internal/assets/gen

  docs:
    desc: 'Serve the docs with MkDocs at http://localhost:8000 (Ctrl-C to stop)'
    cmds:
      - uvx --with mkdocs-material mkdocs serve

  docs-build:
    desc: 'Build the static docs site into ./site'
    cmds:
      - uvx --with mkdocs-material mkdocs build --strict

  install-fyne:
    desc: Install the Fyne packaging CLI (one-time)
    cmds:
      - go install fyne.io/tools/cmd/fyne@latest

  bundle:
    desc: 'Build git-repo-tracker.app into ./dist (same bundle the release ships: menu-bar agent)'
    cmds:
      # MACOSX_DEPLOYMENT_TARGET pins the minimum macOS so the bundle runs on older
      # systems (e.g. Sequoia), not just the SDK version of the build machine.
      - MACOSX_DEPLOYMENT_TARGET=11.0 go build -trimpath -ldflags "-s -w -X main.version=dev" -o dist/{{.BIN}} ./cmd/{{.BIN}}
      - build/macos/package-app.sh --binary dist/{{.BIN}} --version dev --out dist
      - 'echo "Built dist/{{.BIN}}.app — try: open dist/{{.BIN}}.app"'

  linux-deps:
    desc: 'Install the Fyne build dependencies on Debian/Ubuntu'
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}} "{{.APP_NAME}}.app" dist

  release-check:
    desc: Validate the GoReleaser config
    cmds:
      - goreleaser check

  release-snapshot:
    desc: 'Build a local release into ./dist without publishing (validates the build, incl. CGO)'
    cmds:
      - goreleaser release --snapshot --clean

  brew-install:
    desc: 'Install the prebuilt binary from the tap'
    cmds:
      - 'brew install --cask {{.TAP}}/{{.BIN}}'
