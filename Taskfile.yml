version: '3'

vars:
  APP_NAME: Git Repo Tracker
  BIN: git-repo-tracker
  CLI_BIN: git-repo-tracker-cli
  APP_ID: com.github.laszukdawid.git-repo-tracker
  TAP: laszukdawid/tap
  GNOME_UUID: git-repo-tracker@laszukdawid.github.com
  GNOME_DIR: integrations/gnome-shell

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the binary
    cmds:
      - go build -o {{.BIN}} ./cmd/{{.BIN}}

  cli-build:
    desc: Build the headless CLI bridge into ~/.local/bin
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - go build -o "$HOME/.local/bin/{{.CLI_BIN}}" ./cmd/{{.CLI_BIN}}

  run:
    desc: Build and run directly (useful while developing)
    cmds:
      - go run ./cmd/{{.BIN}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Format, vet and test
    deps: [fmt, vet, test]

  icon:
    desc: Regenerate icon.png from the embedded SVG via Fyne's software renderer
    cmds:
      - go run ./internal/assets/gen

  docs:
    desc: 'Serve the docs with MkDocs at http://localhost:8000 (Ctrl-C to stop)'
    cmds:
      - uvx --with mkdocs-material mkdocs serve

  docs-build:
    desc: 'Build the static docs site into ./site'
    cmds:
      - uvx --with mkdocs-material mkdocs build --strict

  install-fyne:
    desc: Install the Fyne packaging CLI (one-time)
    cmds:
      - go install fyne.io/tools/cmd/fyne@latest

  bundle:
    desc: 'Build git-repo-tracker.app into ./dist (same bundle the release ships: menu-bar agent)'
    cmds:
      # MACOSX_DEPLOYMENT_TARGET pins the minimum macOS so the bundle runs on older
      # systems (e.g. Sequoia), not just the SDK version of the build machine.
      - MACOSX_DEPLOYMENT_TARGET=11.0 go build -trimpath -ldflags "-s -w -X main.version=dev" -o dist/{{.BIN}} ./cmd/{{.BIN}}
      - build/macos/package-app.sh --binary dist/{{.BIN}} --version dev --out dist
      - 'echo "Built dist/{{.BIN}}.app — try: open dist/{{.BIN}}.app"'

  linux-deps:
    desc: 'Install the Fyne build dependencies on Debian/Ubuntu'
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

  gnome:deps:
    desc: 'Install GNOME Shell extension development tools on Debian/Ubuntu'
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y gnome-shell-extension-manager gnome-shell-extensions gjs

  gnome:install:
    desc: Clean-install the optional GNOME extension and CLI bridge for development
    deps: [cli-build]
    cmds:
      - rm -rf "$HOME/.local/share/gnome-shell/extensions/{{.GNOME_UUID}}"
      - gnome-extensions pack --force --out-dir /tmp {{.GNOME_DIR}}
      - gnome-extensions install --force "/tmp/{{.GNOME_UUID}}.shell-extension.zip"
      - |
        if gnome-extensions list | grep -Fxq "{{.GNOME_UUID}}"; then
          gnome-extensions info {{.GNOME_UUID}}
        else
          printf '%s\n' "Installed {{.GNOME_UUID}}, but the running GNOME Shell has not discovered it yet."
          printf '%s\n' "Log out/in, then run: task gnome:enable"
        fi

  gnome:enable:
    desc: Enable the development GNOME extension
    cmds:
      - |
        if gnome-extensions list | grep -Fxq "{{.GNOME_UUID}}"; then
          gnome-extensions enable {{.GNOME_UUID}}
        else
          printf '%s\n' "GNOME Shell has not discovered {{.GNOME_UUID}} yet."
          printf '%s\n' "Log out/in, then run: task gnome:enable"
          exit 2
        fi

  gnome:disable:
    desc: Disable the development GNOME extension
    cmds:
      - gnome-extensions disable {{.GNOME_UUID}} || true

  gnome:restart:
    desc: Reinstall and re-enable the GNOME extension after code changes
    cmds:
      - task gnome:disable
      - task gnome:install
      - task gnome:enable

  gnome:logs:
    desc: Tail GNOME Shell logs filtered for git-repo-tracker
    cmds:
      - journalctl --user -f -o cat /usr/bin/gnome-shell | grep --line-buffered -i "git-repo-tracker\|gjs\|{{.GNOME_UUID}}"

  gnome:check:
    desc: Syntax-check the GNOME extension JavaScript
    cmds:
      - node --check {{.GNOME_DIR}}/extension.js

  gnome:clean:
    desc: Remove the installed development GNOME extension
    cmds:
      - gnome-extensions disable {{.GNOME_UUID}} || true
      - rm -rf "$HOME/.local/share/gnome-shell/extensions/{{.GNOME_UUID}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}} "{{.APP_NAME}}.app" dist

  release-check:
    desc: Validate the GoReleaser config
    cmds:
      - goreleaser check

  release-snapshot:
    desc: 'Build a local release into ./dist without publishing (validates the build, incl. CGO)'
    cmds:
      - goreleaser release --snapshot --clean

  brew-install:
    desc: 'Install the prebuilt binary from the tap'
    cmds:
      - 'brew install --cask {{.TAP}}/{{.BIN}}'
